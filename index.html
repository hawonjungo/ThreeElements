<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Three Elements</title>
<!-- Home-screen install: iOS has no Fullscreen API for non-video elements, so the only way to hide Safari's
     chrome is launching from "Add to Home Screen" as a standalone web app (these meta tags). The manifest does
     the same for Android installs and asks for landscape. manifest.webmanifest must sit next to index.html. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Three Elements">
<meta name="theme-color" content="#11141c">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { height: 100%; margin: 0; background: #11141c; color: #cfd6e6; font-family: Consolas, "Lucida Console", monospace; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; box-sizing: border-box; }
  h1 { font-size: 20px; letter-spacing: 2px; margin: 0; color: #f2c14e; text-transform: uppercase; }
  .subtitle { font-size: 12px; color: #8a93a8; margin-top: -8px; }
  #canvas-wrap { position: relative; width: 100%; max-width: 928px; }
  canvas.emscripten {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 928 / 544;
    background: #000;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    border: 2px solid #2a3040;
    touch-action: none;
  }
  #status { font-size: 13px; color: #8a93a8; min-height: 18px; }
  #hint { font-size: 12px; color: #6b7285; max-width: 928px; text-align: center; }
  #rotate-hint { display: none; font-size: 12px; color: #f2c14e; text-align: center; }
  progress { width: 260px; height: 10px; }
  .spinner {
    height: 22px; width: 22px; display: inline-block; vertical-align: middle; margin-right: 8px;
    animation: rotation .8s linear infinite;
    border-left: 4px solid #2a3040; border-right: 4px solid #2a3040; border-bottom: 4px solid #2a3040; border-top: 4px solid #f2c14e;
    border-radius: 100%;
  }
  @keyframes rotation { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* Touch devices (phones/tablets), detected by input type rather than width: large phones are wider than
     900px in landscape (iPhone Pro Max 932px, many Androids ~915px), so a width breakpoint missed them.
     In portrait, nudge the player to rotate (game is a fixed 928x544 landscape shape, so portrait always
     letterboxes badly). In landscape, drop the title/hint chrome and scale the canvas to the largest size that
     fits the screen at the game's aspect ratio (black bars on the long side, never stretched), keeping clear
     of notches via the safe-area insets. */
  @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
    #rotate-hint { display: block; }
  }
  @media (hover: none) and (pointer: coarse) and (orientation: landscape) {
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      gap: 0;
      background: #000;
    }
    h1, .subtitle, #hint, #rotate-hint { display: none; }
    #canvas-wrap { max-width: none; width: auto; }
    canvas.emscripten {
      border: none;
      height: auto;
      width: min(100vw, 100vh * 928 / 544);
      width: min(100vw - env(safe-area-inset-left) - env(safe-area-inset-right),
                 (100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 928 / 544);
    }
    #status, progress { display: none; }
  }
</style>
</head>
<body>
  <h1>Three Elements</h1>
  <div class="subtitle">Invoker-style practice prototype</div>
  <div id="rotate-hint">Xoay ngang màn hình để chơi thoải mái hơn &middot; Rotate your phone to landscape for a bigger screen</div>
  <div id="canvas-wrap">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>
  <div id="status"><span class="spinner" id="spinner"></span>Loading&hellip;</div>
  <progress hidden id="progress" max="100" value="0"></progress>
  <div id="hint">Keyboard: Q/W/E orbs &middot; R invoke &middot; D/F cast &middot; Enter start &middot; Esc back/quit. On touch: use the on-screen buttons.</div>
  <script type="text/javascript">
    var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress');
    var spinnerElement = document.getElementById('spinner');
    var canvasElement = document.getElementById('canvas');
    canvasElement.addEventListener('webglcontextlost', (e) => {
      alert('WebGL context lost. You will need to reload the page.');
      e.preventDefault();
    }, false);
    canvasElement.addEventListener('click', () => canvasElement.focus());

    // Real fullscreen on touch devices: browsers only allow requestFullscreen() from inside a user gesture, so
    // we piggyback on taps on the canvas (the first one is also how they hit Start). If the player leaves
    // fullscreen (Android back gesture), the next tap re-enters it. Once fullscreen, lock to landscape where
    // the browser allows it (Android Chrome; screen.orientation.lock only works while fullscreen). Desktop is
    // untouched. iOS Safari on iPhone has no Fullscreen API for non-video elements: there `req` is missing and
    // the home-screen meta tags above are the only way to hide the browser chrome.
    var isTouchDevice = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
    var lockLandscape = () => {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
    };
    var tryEnterFullscreen = () => {
      if (!isTouchDevice || document.fullscreenElement || document.webkitFullscreenElement) return;
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) return;
      try { Promise.resolve(req.call(el)).then(lockLandscape).catch(() => {}); } catch (e) {}
    };
    canvasElement.addEventListener('pointerdown', tryEnterFullscreen);

    var setStatus = (text) => {
      if (!setStatus.last) setStatus.last = { time: Date.now(), text: '' };
      if (text === setStatus.last.text) return;
      var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      var now = Date.now();
      if (m && now - setStatus.last.time < 30) return;
      setStatus.last.time = now;
      setStatus.last.text = text;
      if (m) {
        text = m[1];
        progressElement.value = parseInt(m[2]) * 100;
        progressElement.max = parseInt(m[4]) * 100;
        progressElement.hidden = false;
        spinnerElement.hidden = false;
      } else {
        progressElement.value = null;
        progressElement.max = null;
        progressElement.hidden = true;
        if (!text) spinnerElement.style.display = 'none';
      }
      statusElement.innerHTML = text || 'Ready.';
    };

    var Module = {
      print: (...args) => console.log(...args),
      canvas: canvasElement,
      setStatus: setStatus,
      totalDependencies: 0,
      monitorRunDependencies: (left) => {
        Module.totalDependencies = Math.max(Module.totalDependencies, left);
        setStatus(left ? 'Preparing... (' + (Module.totalDependencies - left) + '/' + Module.totalDependencies + ')' : 'Ready.');
      }
    };
    setStatus('Downloading...');
    window.onerror = window.onunhandledrejection = () => {
      setStatus('Something went wrong &mdash; see the browser console (F12) for details.');
      spinnerElement.style.display = 'none';
      setStatus = (text) => { if (text) console.error('[post-exception status] ' + text); };
    };
  </script>
  <script async src="index.js"></script>
</body>
</html>
