# Where web/build.sh --deploy publishes the site (sourced by bash).
# Owner's choice B (2026-10-03): the source repository becomes private; the site lives in its own public repository
# that holds only the built game. Until that repository exists, the site stays in the source repository.
#   1. create the public repository on GitHub (empty: no README, no licence)
#   2. change PAGES_REPO below to it, then run web/build.sh --deploy (it creates the gh-pages branch with the CNAME)
#   3. GitHub: old repository Settings > Pages: remove the custom domain; new repository Settings > Pages: deploy from
#      the gh-pages branch, custom domain injoker.relifes.net, Enforce HTTPS
#   4. old repository Settings > General > Danger zone: change visibility to private
PAGES_REPO="hawonjungo/ThreeElements"
PAGES_BRANCH="gh-pages"
# The web leaderboards (spec §33, web/boards): the Worker's address, e.g. https://injoker-boards.<name>.workers.dev
# (no slash at the end). Empty: the web build has no WORLD RANKING button.
BOARDS_URL="${BOARDS_URL:-https://injoker-boards.injoker.workers.dev}"
# The feedback form of /support (EmailJS, https://dashboard.emailjs.com): Email Services > the service id,
# Email Templates > the template id (its "To Email" is the owner's address), Account > General > Public Key.
# These are public by design (they end up in the page); the dashboard should allow only injoker.relifes.net.
# Any of them empty: the form is hidden and the page only shows the email address.
EMAILJS_SERVICE="${EMAILJS_SERVICE:-service_12m14le}"
EMAILJS_TEMPLATE="${EMAILJS_TEMPLATE:-template_655bbqo}"
EMAILJS_PUBLIC_KEY="${EMAILJS_PUBLIC_KEY:-so2ZpNSypwa5KEAL3}"
