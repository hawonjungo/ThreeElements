<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Three Elements</title>
<style>
  html, body { height: 100%; margin: 0; background: #11141c; color: #cfd6e6; font-family: Consolas, "Lucida Console", monospace; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; box-sizing: border-box; }
  h1 { font-size: 20px; letter-spacing: 2px; margin: 0; color: #f2c14e; text-transform: uppercase; }
  .subtitle { font-size: 12px; color: #8a93a8; margin-top: -8px; }
  #canvas-wrap { position: relative; width: 100%; max-width: 928px; }
  canvas.emscripten {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 928 / 544;
    background: #000;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    border: 2px solid #2a3040;
    touch-action: none;
  }
  #status { font-size: 13px; color: #8a93a8; min-height: 18px; }
  #hint { font-size: 12px; color: #6b7285; max-width: 928px; text-align: center; }
  #rotate-hint { display: none; font-size: 12px; color: #f2c14e; text-align: center; }
  progress { width: 260px; height: 10px; }
  .spinner {
    height: 22px; width: 22px; display: inline-block; vertical-align: middle; margin-right: 8px;
    animation: rotation .8s linear infinite;
    border-left: 4px solid #2a3040; border-right: 4px solid #2a3040; border-bottom: 4px solid #2a3040; border-top: 4px solid #f2c14e;
    border-radius: 100%;
  }
  @keyframes rotation { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* Phones: in portrait, nudge the player to rotate (game is a fixed 928x544 landscape shape, so portrait
     always letterboxes badly). In landscape, drop the title/hint chrome and let the canvas fill the screen
     so touch controls have real thumb-sized targets instead of a small centred rectangle. */
  @media (max-width: 900px) {
    #rotate-hint { display: block; }
  }
  @media (max-width: 900px) and (orientation: landscape) {
    body { padding: 4px; gap: 0; justify-content: flex-start; }
    h1, .subtitle, #hint, #rotate-hint { display: none; }
    #canvas-wrap { max-width: 100vw; }
    canvas.emscripten {
      max-height: 96vh;
      max-width: 100vw;
      width: auto;
      height: 96vh;
      margin: 0 auto;
    }
    #status, progress { display: none; }
  }
</style>
</head>
<body>
  <h1>Three Elements</h1>
  <div class="subtitle">Invoker-style practice prototype</div>
  <div id="rotate-hint">Xoay ngang màn hình để chơi thoải mái hơn &middot; Rotate your phone to landscape for a bigger screen</div>
  <div id="canvas-wrap">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>
  <div id="status"><span class="spinner" id="spinner"></span>Loading&hellip;</div>
  <progress hidden id="progress" max="100" value="0"></progress>
  <div id="hint">Keyboard: Q/W/E orbs &middot; R invoke &middot; D/F cast &middot; Enter start &middot; Esc back/quit. On touch: use the on-screen buttons.</div>
  <script type="text/javascript">
    var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress');
    var spinnerElement = document.getElementById('spinner');
    var canvasElement = document.getElementById('canvas');
    canvasElement.addEventListener('webglcontextlost', (e) => {
      alert('WebGL context lost. You will need to reload the page.');
      e.preventDefault();
    }, false);
    canvasElement.addEventListener('click', () => canvasElement.focus());

    var setStatus = (text) => {
      if (!setStatus.last) setStatus.last = { time: Date.now(), text: '' };
      if (text === setStatus.last.text) return;
      var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      var now = Date.now();
      if (m && now - setStatus.last.time < 30) return;
      setStatus.last.time = now;
      setStatus.last.text = text;
      if (m) {
        text = m[1];
        progressElement.value = parseInt(m[2]) * 100;
        progressElement.max = parseInt(m[4]) * 100;
        progressElement.hidden = false;
        spinnerElement.hidden = false;
      } else {
        progressElement.value = null;
        progressElement.max = null;
        progressElement.hidden = true;
        if (!text) spinnerElement.style.display = 'none';
      }
      statusElement.innerHTML = text || 'Ready.';
    };

    var Module = {
      print: (...args) => console.log(...args),
      canvas: canvasElement,
      setStatus: setStatus,
      totalDependencies: 0,
      monitorRunDependencies: (left) => {
        Module.totalDependencies = Math.max(Module.totalDependencies, left);
        setStatus(left ? 'Preparing... (' + (Module.totalDependencies - left) + '/' + Module.totalDependencies + ')' : 'Ready.');
      }
    };
    setStatus('Downloading...');
    window.onerror = window.onunhandledrejection = () => {
      setStatus('Something went wrong &mdash; see the browser console (F12) for details.');
      spinnerElement.style.display = 'none';
      setStatus = (text) => { if (text) console.error('[post-exception status] ' + text); };
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
