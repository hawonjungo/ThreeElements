apply plugin: 'com.android.application'

// ---- NDK / CMake: use the newest ones installed through Android Studio's SDK Manager, so the build does not
// break when a different version is installed. The SDK location comes from local.properties (written by
// Android Studio, or by hand: sdk.dir=C\:\\Users\\<you>\\AppData\\Local\\Android\\Sdk) or ANDROID_HOME.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def sdkDir = localProps.getProperty('sdk.dir') ?: System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')

def newestVersionIn = { String sub ->
    if (sdkDir == null) return null
    def dirs = new File(sdkDir, sub).listFiles()?.findAll { it.isDirectory() }?.collect { it.name }
    if (!dirs) return null
    return dirs.max { a, b ->
        def pa = a.tokenize('.').collect { it.isInteger() ? it.toInteger() : 0 }
        def pb = b.tokenize('.').collect { it.isInteger() ? it.toInteger() : 0 }
        for (int i = 0; i < Math.max(pa.size(), pb.size()); ++i) {
            int d = (i < pa.size() ? pa[i] : 0) <=> (i < pb.size() ? pb[i] : 0)
            if (d != 0) return d
        }
        return 0
    }
}
def installedNdk = newestVersionIn('ndk')
def installedCmake = newestVersionIn('cmake')

// ---- the game's images and sprites: the C++ code opens "assets/...", so the APK's asset root must contain a
// folder named "assets". They are copied from the one shared copy in "Three Elements/assets" at build time.
def gameAssetsRoot = layout.buildDirectory.dir('generated/gameAssets').get().asFile
task copyGameAssets(type: Copy) {
    from "${rootDir}/../Three Elements/assets"
    into new File(gameAssetsRoot, 'assets')
}
preBuild.dependsOn copyGameAssets

// ---- release signing (Google Play upload key). The keystore and its passwords never enter git: local.properties
// points at a properties file kept outside the repo (injoker.signing=D:/Dev/Keys/injoker-keystore.properties) that
// holds storeFile / storePassword / keyAlias / keyPassword. Without it, release builds are simply left unsigned.
def signingProps = new Properties()
def signingPath = localProps.getProperty('injoker.signing')
if (signingPath != null && new File(signingPath).exists()) {
    new File(signingPath).withInputStream { signingProps.load(it) }
}

android {
    namespace 'net.relifes.threeelements'
    compileSdk 36
    if (installedNdk != null) {
        ndkVersion installedNdk
    }

    defaultConfig {
        // Permanent once published on Google Play: the product is Injoker (owner 2026-09-30). The Java namespace
        // (net.relifes.threeelements, where ThreeElementsActivity lives) is internal and may stay as it is.
        applicationId 'net.relifes.injoker'
        minSdk 21
        // Google Play requires a recent target (Android 15 = 35 from Aug 2025, Android 16 = 36 expected from Aug 2026).
        targetSdk 36
        // versionCode must grow with every upload to Play; versionName is what players see.
        versionCode 1
        versionName '1.0.0'
        externalNativeBuild {
            cmake {
                // FLEXIBLE_PAGE_SIZES: native libraries aligned for 16 KB memory pages, required by Google Play for
                // apps targeting Android 15+ (NDK 27 needs the flag; NDK 28+ does it by default).
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                // phones (32 and 64-bit ARM) and x86_64 for the Android Studio emulator, which is how layouts are
                // checked on many screen shapes (cutouts, 20:9, tablets) without owning those devices
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }
    }

    signingConfigs {
        release {
            if (signingProps.getProperty('storeFile') != null) {
                storeFile file(signingProps.getProperty('storeFile'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingProps.getProperty('storeFile') != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            if (installedCmake != null) {
                version installedCmake
            }
        }
    }

    sourceSets.main {
        assets.srcDirs = [gameAssetsRoot]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
